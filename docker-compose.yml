# Local databases for development and tests.
#   make db-up     → start both
#   make db-down   → stop (data kept)
#   make db-reset  → stop and delete dev data
services:
  postgres:
    image: postgres:16-alpine
    container_name: boilerplate-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${DB_NAME:-app}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-app}"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:16-alpine
    container_name: boilerplate-postgres-test
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data # throwaway: fast, wiped on restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
